version: '3.9'

services:
  database:
    image: postgres:latest
    container_name: blogger_ai_debug
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=blogger_ai
    ports:
      - "5433:5432"
    restart:
        unless-stopped
  bot:
    container_name: bot_ai_debug
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      ./.env
    expose:
      - 8000
    tty: true
    depends_on: 
      - database

    